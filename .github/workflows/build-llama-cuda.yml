name: Build llama.cpp with CUDA

on:
  workflow_dispatch:
  push:
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/build-llama-cuda.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: flpdsk-llama
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build llama.cpp with CUDA
        run: |
          nix build .#llama-cpp-cuda \
            --print-build-logs \
            --out-link "$RUNNER_TEMP/llama-cpp-cuda"

      - name: Push to Cachix
        run: |
          cachix push flpdsk-llama "$RUNNER_TEMP/llama-cpp-cuda"
          
      - name: Pin current llama.cpp
        run: |
          LLAMA_PATH="$(readlink -f "$RUNNER_TEMP/llama-cpp-cuda")"

          cachix pin \
            flpdsk-llama \
            llama-current \
            "$LLAMA_PATH" \
            --keep-revisions 1
