name: Update flake inputs and rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update nixpkgs and create flake.lock
        run: |
          nix flake update --update-input nixpkgs

      - name: Commit flake.lock
        run: |
          if [[ -z "$(git status --porcelain -- flake.lock)" ]]; then
            echo "flake.lock is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flake.lock
          git commit -m "Update nixpkgs flake input"
          git push

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: flpdsk-llama
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build updated llama.cpp
        run: |
          nix build .#llama-cpp-cuda \
            --print-build-logs \
            --out-link "$RUNNER_TEMP/llama-cpp-cuda"

      - name: Push updated package to Cachix
        run: |
          cachix push flpdsk-llama "$RUNNER_TEMP/llama-cpp-cuda"
